{% extends "base.html" %}
{% block corpo %}
<div class="entrada">
  <section class="lado-marca">
    <div class="marca">MeuPSIQ</div>
    <p>Agenda, pacientes, financeiro e prontuário para psicologia e psiquiatria.</p>
  </section>
  <main class="lado-form">
    {% if messages %}<ul class="mensagens">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
    {% block formulario %}{% endblock %}
  </main>
</div>
{% endblock %}
