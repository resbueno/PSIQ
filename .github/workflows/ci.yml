name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-somente-para-testes
      DB_HOST: localhost
      DB_USER: psiq_app
      DB_PASSWORD: psiq_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Criar papel sem superusuario (RLS precisa valer nos testes)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -c "CREATE ROLE psiq_app LOGIN PASSWORD 'psiq_dev' NOSUPERUSER NOBYPASSRLS CREATEDB;" \
            -c "CREATE DATABASE psiq OWNER psiq_app;"
      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run
        env:
          DB_NAME: psiq
      - name: Testes
        run: pytest
      - name: Vulnerabilidades em dependências
        run: pip-audit -r requirements.txt
