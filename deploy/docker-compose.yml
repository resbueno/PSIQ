# Exemplo de implantacao em VPS: proxy com TLS (Caddy), aplicacao e PostgreSQL.
# Antes de subir: crie deploy/.env a partir de ../.env.example, rode scripts/db/init-producao.sql no banco,
# e guarde a chave mestra (PSIQ_CHAVE_MESTRA) FORA do banco e do backup.
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   docker compose -f deploy/docker-compose.yml exec app python manage.py migrate   # com DB_USER=psiq_migrator
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dados-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DB_HOST: db
      PSIQ_ANEXOS_DIR: /data/anexos
      PSIQ_BACKUP_MARCADOR: /var/lib/psiq/ultimo-backup-ok
    volumes:
      - anexos:/data/anexos
      - estado:/var/lib/psiq
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
    depends_on: [app]

volumes:
  dados-pg:
  anexos:
  estado:
  caddy-dados:
